# 2026-05-23 fix: restore `packages:` field. pnpm 9+ requires it when
# pnpm-workspace.yaml is present, otherwise every `pnpm run <script>`
# fails with "packages field missing or empty". The `pnpm install`
# command tolerates a missing field, but `pnpm run` does not — which
# is why Vercel's pnpm-based deploys may have been falling back to
# alternate execution paths and CI workflows (e2e.yml, etc.) have
# been failing across recent pushes. Root-only — analytics/ is a
# standalone sub-package, used via `cd analytics && pnpm <cmd>`
# pattern (see root package.json `audit` script), not as a workspace
# member. Including it here would couple root install to analytics'
# lockfile sync which is managed independently.
packages:
  - .

allowBuilds:
  esbuild: true
  sharp: true
# 2026-05-17 CODE-003 fix: removed `${HOME}/dev-cache/...` paths.
# Binding pnpm store + virtualStore to a user-home subpath made the
# repo dependent on HOME being set (broken on some Windows shells)
# and forced cache sharing across personal machines via Dropbox
# sync (which corrupts pnpm's content-addressable store). pnpm's
# default store (~/.local/share/pnpm/store or %LOCALAPPDATA% on
# Windows) is per-user OS-conventional and not synced.
