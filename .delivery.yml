version: 1
adapters:
  work_items: github      # Work items are GitHub issues.
  workspace: git-worktree # Work happens in git worktrees.
  conductor: codex-cli    # Transparency only: the human session that conducts.
  worker: codex           # Default worker provider.
  vcs: github             # GitHub hosts PRs and checks.
  verifier: claude        # Should differ from worker; provider registry key.
  gate: human-merge       # Humans choose what merges.
worker:
  # Optional. Absent = inherit the worker provider's global config. loopcoder never sets this on its own.
  # model:
  # Optional. Absent = inherit the worker provider's global config. loopcoder never sets this on its own.
  # reasoning_effort:
  base_branch: preview
  command_hint: "implement the issue per its merged design doc; run bun run test + bun run typecheck + bun run build + bun run verify:gates; keep the repo English/Japanese only (no Chinese); commit"
# verifier:
#   # Optional. Absent = inherit the verifier provider's global config. loopcoder never sets this on its own.
#   # model:
#   # Optional. Absent = inherit the verifier provider's global config. loopcoder never sets this on its own.
#   # reasoning_effort:
resilience:
  worker:
    heartbeat_interval_seconds: 15
    # Raised from the default 120. Workers here run long silent phases (astro
    # build, font subsetting, Playwright browser smoke tests) with no log growth;
    # the 120s default reaped a completed DIAG worker mid browser-smoke as "stall".
    stale_after_seconds: 600
    # Raised from the default 300 to match the longer stale window above.
    hung_after_seconds: 1800
    max_attempts: 3
    retry_backoff_seconds: [10, 30, 120]
ci:
  checks:
    - Vercel
    # Add CI / quality after GitHub Actions is enabled and the workflow has completed successfully once.
  tests:
    - bun run test
  typecheck:
    - bun run typecheck
  build:
    - bun run build
    - bun run verify:gates
# verification:
#   # Optional. Absent = true for loopcoder code PRs.
#   spec_required: true
#   # Optional. Absent = 3.
#   max_fix_passes: 3
#   browser:
#     # Optional. auto|always|never; absent = auto.
#     enabled: auto
#     # Optional. Changed-path patterns that trigger browser verification in auto mode.
#     globs:
#       - web/**
#       - app/**
#       - "**/*.css"
#       - "**/*.tsx"
report:
  channel: chat
