# GA4 Instrumentation Spec — single source of truth
#
# This file defines every custom event, parameter, dimension, and key event
# we send to Google Analytics 4. Run `analytics/setup-ga4.mjs` to apply this
# spec idempotently to the configured GA4 property (see analytics/README.md).
#
# Property:    G-GLDNBDPF13   (mirai-shigoto.com)
#
# Naming conventions:
#   - Event names: snake_case, lowercase, <= 40 chars
#   - Param names: snake_case, lowercase, <= 40 chars
#   - Param string values: <= 100 chars (GA4 truncates beyond this)
#
# After editing this file, re-run `node analytics/setup-ga4.mjs` to sync.

# ----------------------------------------------------------------------
# Runtime trackers
# ----------------------------------------------------------------------
# These are the page-level analytics/ad trackers wired in
# src/layouts/BaseLayout.astro and related runtime entry points. The GA4
# Admin sync script ignores this block; it is documentation for the deployed
# tracker stack so ANALYTICS.md, .env.example, CSP, and runtime code stay in
# agreement.

trackers:
  - name: ga4_client
    purpose: Primary product analytics from the browser.
    env:
      - PUBLIC_GA4_MEASUREMENT_ID
    script_src:
      - https://www.googletagmanager.com/gtag/js
    endpoints:
      - https://www.google-analytics.com/g/collect
    wired_in:
      - src/layouts/BaseLayout.astro

  - name: google_ads
    purpose: Google Ads conversion tracking through the same gtag.js bootstrap.
    env:
      - PUBLIC_GOOGLE_ADS_ID
    script_src:
      - https://www.googletagmanager.com/gtag/js
    endpoints:
      - https://googleads.g.doubleclick.net
      - https://www.googleadservices.com
    notes:
      - Inert unless PUBLIC_GA4_MEASUREMENT_ID also renders the shared gtag bootstrap.
    wired_in:
      - src/layouts/BaseLayout.astro

  - name: x_pixel
    purpose: X/Twitter Ads attribution.
    env:
      - PUBLIC_X_PIXEL_ID
    script_src:
      - https://static.ads-twitter.com/uwt.js
    endpoints:
      - https://analytics.twitter.com
      - https://t.co
    wired_in:
      - src/layouts/BaseLayout.astro

  - name: meta_pixel
    purpose: Facebook/Instagram Ads attribution.
    env:
      - PUBLIC_META_PIXEL_ID
    script_src:
      - https://connect.facebook.net/en_US/fbevents.js
    endpoints:
      - https://www.facebook.com
      - https://connect.facebook.net
    notes:
      - Consent-gated; does not initialize after an explicit cookie-banner rejection.
    wired_in:
      - src/layouts/BaseLayout.astro

  - name: ga4_measurement_protocol
    purpose: Server-side page_view fallback for browser tracking prevention.
    env:
      - PUBLIC_GA4_MEASUREMENT_ID
      - GA4_MP_API_SECRET
    endpoints:
      - https://www.google-analytics.com/mp/collect
    page_view_params:
      - page_referrer
      - ssrc
      - geo_referrer_engine
      - geo_referrer_bucket
      - geo_referrer_host
      - geo_landing_family
      - geo_citation_candidate
    notes:
      - GEO-E attribution is attached server-side in middleware.ts so AI-engine referrals are still visible when browser-side gtag is blocked.
      - Google AI Overview has no stable dedicated referrer; use `geo_citation_candidate=true` on Google Search referrals to citable landing families as the candidate segment, not as exact proof.
    wired_in:
      - middleware.ts

  - name: cloudflare_web_analytics
    purpose: Privacy-respecting secondary analytics source.
    env:
      - PUBLIC_CF_BEACON_TOKEN
    script_src:
      - https://static.cloudflareinsights.com/beacon.min.js
    endpoints:
      - https://cloudflareinsights.com/cdn-cgi/rum
    wired_in:
      - src/layouts/BaseLayout.astro

  - name: vercel_web_analytics
    purpose: First-party visitor-count source.
    env: []
    script_src:
      - /_vercel/insights/script.js
    endpoints:
      - /_vercel/insights/event
    wired_in:
      - src/layouts/BaseLayout.astro

  - name: vercel_speed_insights
    purpose: Core Web Vitals trend tracking.
    env: []
    script_src:
      - /_vercel/speed-insights/script.js
    endpoints:
      - https://vitals.vercel-insights.com
    wired_in:
      - src/layouts/BaseLayout.astro

# ----------------------------------------------------------------------
# Events
# ----------------------------------------------------------------------
# Each event is a `gtag('event', name, params)` call from the front end.
# `conversion: true` marks the event as a Key Event (formerly Conversion)
# so it shows up in GA4 conversion reports.

events:
  # ---- Lifecycle & navigation ----
  - name: map_loaded
    description: Treemap finished initial render after data.treemap.json loaded.
    params:
      - { name: language, type: string, desc: "ja or en at time of load" }
      - { name: device_category, type: string, desc: "mobile / tablet / desktop (client-derived)" }
      - { name: tile_count, type: int, desc: "Number of tiles rendered (556 today)" }
    conversion: false

  # `language_switch` — REMOVED 2026-05-06. Was wired to the JA/EN language
  # switcher that v1.4.0 deleted (site is now JA-only, /en/* 301 → /ja/*).
  # Event will never fire again. Historical event data still in GA4 for
  # the prior 14-month retention window. `from_lang` / `to_lang` / `path`
  # parameters are left as global params (used by other events) — not
  # specifically tied to language_switch any more, so no parameter cleanup
  # needed.

  - name: layer_change
    description: User switched the color layer (AI risk / salary / age / etc.)
    params:
      - { name: layer_name, type: string, desc: "ai_risk | salary | age | hours | recruit_ratio | education" }
      - { name: from_layer, type: string }
      - { name: language, type: string }
    conversion: false

  - name: palette_change
    description: User toggled the color palette (default red-green vs colorblind-safe).
    params:
      - { name: palette, type: string, desc: "red_green | viridis (or whatever the toggle exposes)" }
      - { name: language, type: string }
    conversion: false

  # ---- Treemap interaction ----
  - name: occupation_tile_click
    description: |
      User clicked / tapped a tile on the treemap and the per-occupation page
      opened. Fires from canvas click (desktop), touch second-tap (mobile),
      and keyboard Enter/Space, distinguished by `source`. The user immediately
      navigates to /ja/<id> or /en/<id> after this event.
    params:
      - { name: occupation_id, type: int }
      - { name: occupation_name_ja, type: string }
      - { name: occupation_name_en, type: string }
      - { name: ai_risk_score, type: int }
      - { name: risk_tier, type: string, desc: "high (>=7) | mid (5-6) | low (<=4)" }
      - { name: salary, type: int, desc: "Annual salary in 10,000 JPY units" }
      - { name: tile_position_idx, type: int, desc: "0-indexed position in rendered rect list (-1 if not findable)" }
      - { name: source, type: string, desc: "desktop_click | touch_tap | keyboard" }
      - { name: language, type: string }
    conversion: true   # treemap → occupation page is the primary navigation funnel

  - name: tooltip_view
    description: |
      Desktop hover triggered tooltip display (proxy for desktop tile interest).
      Sampled at 10% client-side (Math.random() < 0.10) — full rate would
      dwarf every other event since tooltips fire on every hover. The 10%
      sample is representative for "which occupations attract attention"
      analysis. Multiply tooltip_view counts by 10 when extrapolating to
      total tooltip volume.
    params:
      - { name: occupation_id, type: int }
      - { name: ai_risk_score, type: int }
      - { name: language, type: string }
    conversion: false   # signal-only, not a conversion goal

  # `search_used` — REMOVED 2026-05-02. Was deprecated, never emitted; replaced
  # entirely by `job_search_submit` (which logs the query text). Removing from
  # spec so scripts/check-analytics-spec.ts doesn't flag it as registered-but-
  # never-sent. (This comment named `check_spec_vs_code.mjs` until 2026-07-28.
  # That script was deleted in PR 37 as legacy migration tooling — see CHANGELOG
  # "Legacy migration tooling" — leaving this file with no verification at all
  # until issue #231, by which point 8 events and 6 params had drifted.)

  # P0-A (2026-05-06): `job_search_submit` was renamed to `job_search_typed` and
  # demoted from a Key Event. Reason: it fired on every typing-pause and conflated
  # two distinct user intents — visual filter ("typed 医 to dim non-medical tiles")
  # vs navigate ("typed 看護師 to open that page"). The CTR denominator was
  # polluted by filter-only users, making job_search_navigate / job_search_submit
  # = 22% unusable as a real search-CTR. The new `job_search_intent` event
  # captures only navigate-style engagement. See CHANGELOG 2026-05-06.

  - name: job_search_typed
    description: |
      User typed in the treemap search box and paused (800 ms idle). Fires
      once per distinct query — backspacing back to a previously tracked
      query does not re-fire. Only fires when the trimmed query is non-empty.
      Use this to surface popular queries / dataset coverage gaps. Do NOT
      use it as a CTR denominator — it includes visual-filter users who
      never intended to navigate. Use `job_search_intent` for CTR instead.
    params:
      - { name: query, type: string, desc: "Trimmed query, truncated to 100 chars (GA4 string-param max)" }
      - { name: match_count, type: int, desc: "Number of tiles matching the query at fire time. 0 = no results — useful for finding gaps in the dataset." }
      - { name: language, type: string }
    conversion: false   # demoted from KPI — see job_search_intent for the new CTR denominator

  - name: job_search_intent
    description: |
      User showed clear intent to navigate from the search box (not just
      visual-filter intent). Fires from one of four triggers, deduped per
      distinct query so the same query produces at most one intent event:
        1. Form submit (Enter on input or click "AI 影響度をチェック" /
           "診断" button), regardless of whether a match was found.
        2. ArrowDown / ArrowUp pressed inside the autocomplete dropdown.
        3. Mouse hover over an autocomplete suggestion ≥ 500 ms.
        4. Mousedown / touchstart on an autocomplete suggestion.
      Real search-CTR = job_search_navigate / job_search_intent. Stays close
      to 100% when the autocomplete UX is good; drops when users engage but
      can't find / don't commit.
    params:
      - { name: query, type: string, desc: "Trimmed query, truncated to 100 chars" }
      - { name: intent_source, type: string, desc: "submit | arrow_keys | hover | click" }
      - { name: language, type: string }
    conversion: true   # KPI #1 (replaces the former job_search_submit role)

  - name: popular_job_click
    description: |
      User clicked one of the 5 hero chips (mobile §7.11 or desktop §7.12).
      Replaces the older `chip_click` event. Fires from `navigateToJob(rec, "chip")`
      and immediately navigates to the mapped occupation page (`CHIP_TO_JOB`).
    params:
      - { name: occupation_id, type: int }
      - { name: occupation_name_ja, type: string }
      - { name: occupation_name_en, type: string }
      - { name: ai_risk_score, type: int }
      - { name: language, type: string }
      - { name: source, type: string, desc: "always 'chip' — kept as a param so dashboards can union with job_search_navigate for total navigation volume" }
    conversion: true   # primary chip → occupation funnel

  - name: job_search_navigate
    description: |
      User triggered a navigation from the search field — Enter key on the
      input, click of the「AI 影響度をチェック」button, click on a
      `.search-suggest` dropdown item, or keyboard Enter on a focused
      suggest item. All four paths land on the same `/ja/<id>` or `/en/<id>`
      via `navigateToJob(rec, source)`.
    params:
      - { name: occupation_id, type: int }
      - { name: occupation_name_ja, type: string }
      - { name: occupation_name_en, type: string }
      - { name: ai_risk_score, type: int }
      - { name: language, type: string }
      - { name: source, type: string, desc: "search_submit | suggest_click | suggest_keyboard" }
    conversion: true   # primary search → occupation funnel

  # `?q=` deep links (added to spec 2026-07-28, issue #231 — the emits predate
  # the registration). A visitor arriving with a search term in the URL is
  # resolved against data.search.json: an exact title match navigates straight
  # through, anything else pre-fills the hero inputs and stays on the map.
  # Splitting the two tells us how many deep links actually land where the
  # visitor wanted, which a single event would hide.
  - name: search_action_redirect
    description: |
      A `?q=` deep link matched an occupation title exactly and redirected
      straight to its page. Uses `location.replace`, so the back button skips
      this hop — the visitor never sees the map.
    params:
      - { name: query, type: string, desc: "Raw ?q= value, truncated to 100 chars" }
      - { name: occupation_id, type: int }
      - { name: language, type: string }
    conversion: true   # deep link → occupation page, same funnel as job_search_navigate

  - name: search_action_landed
    description: |
      A `?q=` deep link did NOT match exactly, so the visitor landed on the map
      with all three hero inputs pre-filled. `match_count` is how many partial
      matches were offered; 0 means the term found nothing at all.
    params:
      - { name: query, type: string, desc: "Raw ?q= value, truncated to 100 chars" }
      - { name: match_count, type: int, desc: "Partial matches offered; 0 = no result" }
      - { name: language, type: string }
    conversion: false   # landed on the map, not yet on an occupation

  # ---- Modal lifecycle — REMOVED 2026-05-02 ----
  # `occupation_modal_open`, `modal_close`, `report_cta_click` were the
  # Phase-0 modal funnel. Stage 1 replaced the modal with dedicated
  # /ja/<id> + /en/<id> pages, so these events have no emit site any
  # more. Their successors are `result_view` (page load) + `tooltip_cta_click`
  # (mobile entry from treemap tooltip).

  - name: tooltip_cta_click
    description: User tapped the "詳細を見る →" / "View details →" CTA inside the mobile touch-mode tooltip. The explicit funnel from treemap tile → occupation detail page (Design.md §6.6).
    params:
      - { name: occupation_id, type: int }
      - { name: ai_risk_score, type: int }
      - { name: risk_tier, type: string }
      - { name: language, type: string }
    conversion: false   # not a key event yet — observe a few weeks before promoting

  - name: tile_double_tap_open
    description: User double-tapped a tile on mobile to open the occupation detail page directly (the legacy "shortcut" path, kept alongside the explicit CTA so power users still have a fast option). Lets us A/B the funnel between the visible CTA and the hidden double-tap shortcut.
    params:
      - { name: occupation_id, type: int }
      - { name: ai_risk_score, type: int }
      - { name: language, type: string }
    conversion: false

  # `chip_click` was the original event for mobile-hero chip taps when chips
  # filtered the treemap. As of Stage 1 (2026-05-02) chips do 1-step direct
  # navigation via CHIP_TO_JOB, so this event was replaced by
  # `popular_job_click` above. Removed from spec — no event currently fires
  # under this name in the production codebase.

  - name: result_view
    description: |
      Per-occupation page view. Fires synchronously on page load from the
      generated /ja/<id>.html and /en/<id>.html pages. Distinct from GA4's
      auto-fired page_view because the parameters are typed (occupation_id,
      ai_risk_score, risk_tier) — page_view only carries the URL.
    params:
      - { name: occupation_id, type: int }
      - { name: ai_risk_score, type: int }
      - { name: risk_tier, type: string, desc: "high (>=7) | mid (5-6) | low (<=4)" }
      - { name: language, type: string }
    conversion: true   # Yaku's推广方案 KPI #3 — promote to Key Event

  - name: jobtag_outbound_click
    description: |
      User clicked the "出典 / 厚生労働省 job tag" link in the source-row of a
      per-occupation page, navigating away to the MHLW jobtag site. Used to
      measure flow of users who chose to verify against / continue at the
      official source after consuming our analysis. Compliance-relevant —
      proves the attribution chain ja/<id> → MHLW is being used. Wired in
      src/pages/ja/[id].astro via inline onclick gtag('event', ...).
    params:
      - { name: occupation_id, type: int }
      - { name: ai_risk_score, type: int }
      - { name: language, type: string }
    conversion: false   # informational, not a primary conversion goal

  # Email capture and feedback delivery were retired under #202. Historical
  # data remains in GA4, but this active spec no longer syncs their schema.

  # ---- Sharing ----
  # `share_x_click` was per-platform — replaced 2026-05-02 by the unified
  # `share_click` event below, which carries `platform` as a param so all
  # share platforms feed one event with consistent UTM contracts.
  - name: share_click
    description: |
      User clicked any share button (X, LINE, Hatena, LinkedIn, Facebook,
      Copy, Native). Fires from both the home-page footer and from the
      1,104 occupation detail pages. URL embeds UTM params per
      Design.md §7.13.
    params:
      - { name: platform, type: string, desc: "x | line | hatena | linkedin | facebook | copy | native" }
      - { name: language, type: string }
      - { name: occupation_id, type: int, desc: "Set on occupation pages, 0 on home page." }
    conversion: false

  # ---- Follow ----
  - name: x_follow_click
    description: |
      User clicked the orange「X でフォローする」CTA in the unified footer
      (Design.md §7.13). Lives on the home page and on every occupation
      detail page; on detail pages the `occupation_id` carries the page's id
      so we can attribute follows to specific high-engagement occupations.
    params:
      - { name: language, type: string }
      - { name: occupation_id, type: int, desc: "Set on occupation pages, 0 on home page." }
    conversion: false   # observe a few weeks before promoting

  # ---- Theme (light/dark) ----
  - name: theme_change
    description: User toggled the light/dark theme via the round button next to the language switcher.
    params:
      - { name: from, type: string, desc: "previous theme — 'light' | 'dark'" }
      - { name: to, type: string, desc: "next theme — 'light' | 'dark'" }
      - { name: was_explicit, type: string, desc: "true if user already had an explicit choice in localStorage; false if first toggle from system default" }
      - { name: system_pref, type: string, desc: "browser-reported prefers-color-scheme — 'light' | 'dark'" }
    conversion: false

  # ---- /map page (Design-Mobile.md §4.8) ----
  # Mobile-first independent occupation map with sector segmented treemap +
  # bottom sheet detail preview. These 4 events let us measure the discovery
  # → exploration → detail-jump funnel separately from the homepage flows.

  - name: map_open
    description: |
      User landed on /map. Fires once per page load after data finishes loading.
      Use the `referrer` param to attribute back to the entry point: home_card
      (mobile preview-card tap), direct (typed URL / bookmark / external),
      detail (back-navigation from a /ja/<id> page), internal (from another
      site page), external (from a different host).
    params:
      - { name: referrer, type: string, desc: "'home_card' | 'direct' | 'detail' | 'internal' | 'external'" }
    conversion: false

  - name: map_filter
    description: |
      User changed the sector chip OR the sort dropdown on /map. Fires per
      change (not debounced). Use to understand which sectors get explored
      and which sort order users prefer.
    params:
      - { name: sector, type: string, desc: "selected sector_id, or 'all'" }
      - { name: sort, type: string, desc: "'ai_risk_desc' | 'ai_risk_asc' | 'salary_desc' | 'workers_desc'" }
    conversion: false

  - name: map_cell_tap
    description: |
      User tapped a treemap cell on /map, opening the bottom sheet. Distinct
      from map_detail_click (which fires when they then jump to the detail
      page). The gap between map_cell_tap and map_detail_click counts is the
      "preview-only" funnel — users who looked but didn't go deeper.
    params:
      - { name: job_id, type: int, desc: "occupation id; see data/occupations/. Sparse 1..584 — NOT contiguous and NOT the occupation count (556). A 1..556 filter silently drops ids 557-584." }
      - { name: sector, type: string, desc: "occupation's sector_id" }
      - { name: rank, type: int, desc: "global ranking by ai_risk desc (1..556), 0 if outside Top 50" }
    conversion: false

  - name: map_detail_click
    description: |
      Bottom-sheet "詳細を見る" CTA tap on /map → /ja/<id>. This is the /map
      → detail conversion event; pair with map_open as denominator for funnel
      conversion rate.
    params:
      - { name: job_id, type: int, desc: "occupation id; see data/occupations/. Sparse 1..584 — NOT contiguous and NOT the occupation count (556). A 1..556 filter silently drops ids 557-584." }
    conversion: true   # /map → detail jump is the page's primary funnel goal

  # ---- /me page ----
  # Added to spec 2026-07-28 (issue #231). Emitted since the page shipped;
  # they were never registered, so the params below were unqueryable.

  # Issue #234. /me and the diagnostic sat behind the global nav — on mobile,
  # which is 91% of sessions, behind a hamburger — and the surfaces carrying the
  # traffic had no in-content path to them. This event measures the in-content
  # entries added on occupation, rankings and compare pages; without it the
  # effect cannot be separated from background variation in /me traffic.
  #
  # Both parameters reuse existing dimensions on purpose: the property is at
  # 47/50 event-scoped dimensions (#240), so a new one would have consumed a
  # third of the remaining budget for a single event.
  - name: nav_drawer_open
    description: |
      Mobile drawer opened (#234). 91% of sessions are mobile and every drawer
      entry costs two taps, so a flat /me number cannot say whether the drawer
      is never opened or opened and ignored — opposite fixes. This is the
      denominator; me_entry_click with source=nav_drawer is the numerator.
      Carries no custom parameter: the page it was opened from arrives in the
      built-in page_location.
    params:
      - { name: language, type: string }
    conversion: false

  - name: list_row_click
    description: |
      Visitor tapped a whole-row occupation link on a List-shape ranking page
      (#321). The only custom parameter is language; occupation identity
      arrives in the built-in page_location of the following page_view.
    params:
      - { name: language, type: string }
    conversion: false

  - name: search_overlay_open
    description: |
      Mobile top-bar search overlay opened (#327). The only custom parameter
      is language; the page it was opened from arrives in page_location.
      Query text is never sent.
    params:
      - { name: language, type: string }
    conversion: false

  - name: search_overlay_navigate
    description: |
      Visitor tapped a search overlay result row (#327). Occupation identity
      arrives in the following page_view's page_location. Query text is
      never sent.
    params:
      - { name: language, type: string }
    conversion: false

  - name: me_entry_click
    description: |
      Visitor followed an in-content entry into /me. `source` distinguishes the
      surface; `occupation_id` is the occupation in context, and is 0 on the
      rankings and compare surfaces, which have no single occupation.
      `nav_drawer` is the mobile drawer row — global chrome rather than
      in-content, and the only source that pairs with nav_drawer_open.
      `top_nav` is the desktop sticky bar row (same chrome, one tap).
    params:
      - { name: occupation_id, type: int, desc: "occupation in context; 0 on list surfaces. Sparse 1..584, not the 556 count" }
      - { name: source, type: string, desc: "occupation | rankings | compare | sectors | nav_drawer | top_nav | home_door" }
      - { name: language, type: string }
    conversion: false   # entry into the funnel, not its goal — shindan_result_view is

  - name: me_open
    description: |
      /me finished loading. `from_bookmark` separates a returning visitor
      restoring a saved position (`?id=` present) from a cold start, which is
      the difference between repeat use and first use of the page.
    params:
      - { name: from_bookmark, type: int, desc: "1 = arrived with ?id=, 0 = cold start" }
    conversion: false

  - name: me_select_job
    description: User picked an occupation on /me to position themselves against.
    params:
      - { name: job_id, type: int, desc: "occupation id; sparse 1..584, not the 556 count" }
      - { name: sector, type: string, desc: "sector id of the chosen occupation" }
    conversion: false

  # ---- /shindan page ----
  # Result / share / gap added 2026-07-28 (#231). Start / step added 2026-08-16
  # (#256) so abandonment is visible before the /me merge.
  - name: shindan_start
    description: |
      First answered question on /shindan (#256 / acq-2). Distinguishes
      "landed on the page" (page_view) from "began the quiz". Restored or
      shared results do not fire this. Compare to shindan_result_view for
      start-to-completion abandonment. conversion false — entry, not the goal.
    params: []
    conversion: false
  - name: shindan_step
    description: |
      One fire per newly reached answered-count (1..9) after shindan_start.
      Uses GA4 builtin `value` as the step index so Explorations / BigQuery
      can read the step without a new event-scoped dimension (#240 cap).
    params:
      - { name: value, type: int, desc: "Answered-count just reached, 1..9. GA4 builtin — not a custom dimension." }
    conversion: false
  - name: shindan_result_view
    description: |
      The diagnostic finished and the result was shown. This is the completion
      signal for the /shindan funnel — compare against page_view on /shindan
      for the drop-off rate.
    params:
      - { name: family_code, type: string, desc: "One of the 16 type codes" }
      - { name: variant_id, type: string, desc: "Copy variant shown within the family" }
      - { name: variant_bucket, type: string, desc: "Bucket the variant was drawn from" }
    conversion: true   # completing the diagnostic is the page's goal

  - name: shindan_share_click
    description: Visitor shared their result. `platform` covers every share path.
    params:
      - { name: platform, type: string, desc: "copy | native | x | line" }
      - { name: family_code, type: string }
      - { name: variant_id, type: string }
    conversion: true   # sharing is the only organic acquisition loop the page has

  - name: shindan_gap_select_job
    description: |
      From the result, the visitor picked an occupation to compare against their
      type. `gap` is the direction of the mismatch, which is what makes the
      result actionable rather than decorative.
    params:
      - { name: family_code, type: string, desc: "The visitor's own type code" }
      - { name: job_id, type: int, desc: "occupation id; sparse 1..584" }
      - { name: job_code, type: string, desc: "Type code of the chosen occupation" }
      - { name: gap, type: string, desc: "Kind of mismatch between the two codes" }
    conversion: false

  # ---- 404 ----
  - name: page_not_found
    description: |
      A 404 rendered. Added to spec 2026-07-28 (issue #231); it has been
      emitting since the page shipped. All three params are GA4 built-ins, so
      no custom dimension is needed — `page_referrer` is the useful one, since
      it identifies which internal link or external site is sending traffic to
      a dead URL.
    params:
      - { name: page_location, type: string }
      - { name: page_path, type: string }
      - { name: page_referrer, type: string, desc: "'(direct)' when document.referrer is empty" }
    conversion: false

  # ---- Server-side delivery measurement ----
  #
  # Issue #253. `page_view` and `page_delivery` are different units and must
  # never share a name again:
  #
  #   page_view      a person viewed a page. Client-side gtag.js only.
  #                  Feeds GA4's built-in Views / sessions / engagement.
  #   page_delivery  we served a page. Edge middleware (MP) only. Includes
  #                  clients whose browser blocks gtag.js (~44% of deliveries)
  #                  and named AI agents.
  #
  # From 2026-07-28 to 2026-08-14 the middleware sent `page_view`. GA4 counts
  # anything it receives as a session, so ~1,100 single-event sessions a day
  # buried the real population: sessions read 687 → 1,969/day while actual paid
  # traffic fell 74%. A definition change read as a trend. See ANALYTICS.md
  # §計測単位 — that section is the contract this event implements.
  #
  # `page_delivery ÷ page_view` is the tracking-prevention rate, which has no
  # other measurable source.
  - name: page_delivery
    description: |
      One page served by the Edge middleware, sent via Measurement Protocol
      (#253). NOT a person viewing a page — that is `page_view`, client-side
      only. `client_kind` separates browsers from AI agents; `agent_name` names
      the agent. Deliveries that cannot join a real gtag.js session use a
      deterministic per-day bucket identity, so eventCount is exact while
      sessions stay bounded. Do not read session-scoped metrics off this event.
    params:
      - { name: ssrc, type: string, desc: "'mw' — sent by Vercel Edge middleware" }
      - { name: client_kind, type: string, desc: "browser | ai_agent. other_bot is refused before send" }
      - { name: agent_name, type: string, desc: "gptbot | chatgpt_user | claudebot | perplexitybot | … ; '(none)' for browsers" }
      - { name: geo_referrer_engine, type: string }
      - { name: geo_referrer_bucket, type: string }
      - { name: geo_referrer_host, type: string }
      - { name: geo_landing_family, type: string }
      - { name: geo_citation_candidate, type: string }
    conversion: false

# ----------------------------------------------------------------------
# Custom Dimensions — event-scoped
# ----------------------------------------------------------------------
# Every event parameter we want to GROUP BY in standard reports must be
# registered as a custom dimension. Built-in dimensions (utm_source,
# session_source, page_path, country, etc.) do NOT need to be registered.

event_scoped_dimensions:
  - parameter_name: occupation_id
    display_name: Occupation ID
    description: Numeric ID matching jobtag. Sparse 1..584 — not contiguous, and not the occupation count (556).

  - parameter_name: occupation_name_ja
    display_name: Occupation JA
    description: Japanese occupation title from data.treemap.json.

  - parameter_name: occupation_name_en
    display_name: Occupation EN
    description: English occupation title from data.treemap.json.

  - parameter_name: ai_risk_score
    display_name: AI Risk Score
    description: 0–10 LLM-scored AI exposure for the occupation.

  - parameter_name: risk_tier
    display_name: Risk Tier
    description: Bucketed AI risk (high >=7, mid 5-6, low <=4).

  - parameter_name: salary
    display_name: Annual Salary
    description: Annual salary in 10,000 JPY units (manyen).

  - parameter_name: layer_name
    display_name: Layer Name
    description: Active color layer at time of event.

  # `open_method` / `close_method` — REMOVED 2026-05-06 from spec. They were
  # introduced for the modal lifecycle (occupation_modal_open / modal_close)
  # which was deleted 2026-05-02. The dimensions still exist on the live GA4
  # property to preserve historical data; we just don't sync them anymore.

  # `from_modal` — REMOVED 2026-05-06 from spec. Was a parameter on the old
  # `jobtag_outbound_click` event when both modal-path and per-page-path
  # existed; v1.4.0 removed the modal entirely and the param was dropped
  # from the event in favor of `ai_risk_score`. Live GA4 dimension preserved
  # for historical data; spec just no longer syncs it.

  - parameter_name: tile_position_idx
    display_name: Tile Position Index
    description: 0-indexed rendered position of the clicked tile (proxy for prominence).

  - parameter_name: source
    display_name: Navigation Source
    description: How user arrived at navigation. Values include desktop_click, touch_tap, keyboard, chip, search_submit, suggest_click, suggest_keyboard.

  - parameter_name: query
    display_name: Search Query
    description: Trimmed query string the user typed into the treemap search box (max 100 chars). Used to surface most-searched occupation terms.

  - parameter_name: match_count
    display_name: Search Match Count
    description: Number of treemap tiles matching the query at fire time. 0 = surfaces dataset gaps (terms users want that we don't cover).

  - parameter_name: intent_source
    display_name: Search Intent Source
    description: How job_search_intent was triggered. Values - submit, arrow_keys, hover, click. Lets dashboards split keyboard vs mouse vs touch engagement.

  - parameter_name: platform
    display_name: Share Platform
    description: Which share platform the user picked. `x | line | hatena | linkedin | facebook | copy | native`. Used by `share_click`.

  - parameter_name: device_category
    display_name: Device Category
    description: Client-derived `mobile | tablet | desktop` at `map_loaded` time. Lets reports split by device without relying on GA4's noisy auto-derivation.

  - parameter_name: tile_count
    display_name: Tile Count Rendered
    description: Number of tiles drawn at initial treemap render (556 today). Surfaces dataset growth and partial-render anomalies.

  - parameter_name: from_layer
    display_name: Layer Switch Source
    description: Previously active color layer at the moment of a `layer_change` (paired with `layer_name` which is the new value).

  # `time_open_ms` — REMOVED 2026-05-06 from spec (same reason as
  # open_method / close_method above). Live GA4 dimension preserved for history.

  - parameter_name: palette
    display_name: Color Palette
    description: Active color palette at time of event.

  # ---- theme_change params ----
  - parameter_name: from
    display_name: Theme From
    description: Previous theme before user toggled (light / dark). Used by event `theme_change`.

  - parameter_name: to
    display_name: Theme To
    description: Next theme after user toggled (light / dark). Used by event `theme_change`.

  - parameter_name: was_explicit
    display_name: Theme Was Explicit
    description: "true if user already had an explicit choice in localStorage; false on first toggle from system default."

  - parameter_name: system_pref
    display_name: System Color Preference
    description: Browser-reported `prefers-color-scheme` at the moment of the toggle (light / dark).

  # ---- Server-side delivery / GEO citation params ----
  #
  # All eight ride the `page_delivery` event from the Edge middleware
  # (src/lib/middleware-helpers.ts), never a `gtag()` call.
  #
  # These carried `sent_by: server` until #253. That marker existed only to
  # exempt them from setup-ga4.mjs's "is this dimension used by any event?"
  # orphan check, which structurally could not see them while they rode
  # `page_view` — a GA4 built-in, and so not declared under `events:` (#247).
  # `page_delivery` IS declared, so the orphan check now covers them for real
  # and the exemption is gone. Real coverage beats a suppressed warning.
  - parameter_name: ssrc
    display_name: Server Source
    description: Source marker for Measurement Protocol hits. `mw` means the hit came from Vercel Edge middleware.

  # Full value lists live on the page_delivery event above and in
  # AI_AGENT_UA_PATTERNS; GA4 caps this field at 150 characters.
  - parameter_name: client_kind
    display_name: Client Kind
    description: "Client the page was delivered to. Values - browser, ai_agent. other_bot (scanners, SEO crawlers, monitors) is refused before send."

  - parameter_name: agent_name
    display_name: AI Agent Name
    description: "AI agent id when client_kind=ai_agent - gptbot, chatgpt_user, claudebot, perplexitybot, google_extended, bytespider, etc. (none) for browsers."

  - parameter_name: geo_referrer_engine
    display_name: GEO Referrer Engine
    description: "Normalized source value: perplexity, chatgpt_search, gemini, bing_copilot, claude, google_search, bing_search, internal, direct, or other_external."

  - parameter_name: geo_referrer_bucket
    display_name: GEO Referrer Bucket
    description: Coarse source bucket for GEO reporting. Values - ai_engine, search, internal, direct, external.

  - parameter_name: geo_referrer_host
    display_name: GEO Referrer Host
    description: Normalized referring hostname only, with no path or query. Used for off-site mention and citation drilldowns.

  - parameter_name: geo_landing_family
    display_name: GEO Landing Family
    description: Landing page family for citation analysis. Values - occupation, answers, qa, sector, ranking, compare, standard, methodology, map, other.

  - parameter_name: geo_citation_candidate
    display_name: GEO Citation Candidate
    description: "String boolean: true for AI-engine or citable-page search referrals where AI Overview-style citation is plausible but unproven."

  # ---- /map page params (Design-Mobile.md §4.8) ----
  - parameter_name: referrer
    display_name: Map Page Referrer
    description: How the user arrived at /map. Values - home_card, direct, detail, internal, external. Used by `map_open` to attribute the funnel.

  - parameter_name: sector
    display_name: Sector ID
    description: "JILPT major-sector id (for example iryo, jimu, seizo) used by map_filter and map_cell_tap; may also group other events."

  - parameter_name: sort
    display_name: Map Sort Order
    description: Active sort order on /map. Values - ai_risk_desc, ai_risk_asc, salary_desc, workers_desc. Used by `map_filter`.

  - parameter_name: rank
    display_name: Global AI Risk Rank
    description: "1-based AI-risk rank (workers-desc tiebreaker); 0 outside the Top 50 shown in the map bottom sheet. Used by map_cell_tap."

  - parameter_name: job_id
    display_name: Job ID
    description: "Numeric occupation id (map_cell_tap, map_detail_click); same id space as occupation_id. Sparse 1..584 — not contiguous, not the 556 count."

  # ---- /shindan + /me (registered 2026-07-28, issue #231) ----
  # These parameters have been sent since their pages shipped, but were never
  # declared, so none of them could be used as a report dimension. Register in
  # the GA4 UI as well — a spec entry alone does not create the dimension.

  - parameter_name: family_code
    display_name: Shindan Type Code
    description: "One of the 16 /shindan type codes. Sent by all three shindan_* events; the dimension that makes the type distribution reportable."

  - parameter_name: variant_id
    display_name: Shindan Copy Variant
    description: "Which copy variant of the family was shown. Used by shindan_result_view and shindan_share_click; lets share rate be compared per variant."

  - parameter_name: variant_bucket
    display_name: Shindan Variant Bucket
    description: "Bucket the variant was drawn from. Used by shindan_result_view."

  - parameter_name: job_code
    display_name: Shindan Occupation Type Code
    description: "Type code of the occupation the visitor compared against, as opposed to family_code which is their own. Used by shindan_gap_select_job."

  - parameter_name: gap
    display_name: Shindan Gap Kind
    description: "Direction of mismatch between the visitor's type and the chosen occupation's. Used by shindan_gap_select_job."

  - parameter_name: from_bookmark
    display_name: Me Opened From Bookmark
    description: "1 when /me was opened with a saved ?id=, 0 on a cold start. Used by me_open to separate repeat from first use."

# ----------------------------------------------------------------------
# Custom Dimensions — user-scoped (persist across sessions)
# ----------------------------------------------------------------------

user_scoped_dimensions:
  - parameter_name: language_preference
    display_name: Language Preference
    description: User's language at time of first session (ja / en).

# ----------------------------------------------------------------------
# Key Events (formerly "conversions")
# ----------------------------------------------------------------------
# These are auto-derived from `events[].conversion: true`. Listed here
# explicitly for visibility.

key_events:
  # — Funnel: arrival → occupation page —
  - occupation_tile_click   # treemap tile → /ja/<id> or /en/<id>
  - popular_job_click       # hero chip → /ja/<id> or /en/<id> (Stage 1)
  - job_search_intent       # user engaged with autocomplete (KPI #1, real CTR denominator since 2026-05-06)
  - job_search_navigate     # search input Enter / suggest click → /ja/<id> (Stage 1)
  - result_view             # /ja/<id> or /en/<id> page-view fired with typed params (Stage 1, KPI #3)
  - search_action_redirect  # deep link → occupation page, same funnel as job_search_navigate
  # — Per-surface goals (each is the primary conversion of its own page) —
  - map_detail_click        # /map → detail jump
  - shindan_result_view     # diagnostic completed
  - shindan_share_click     # the only organic acquisition loop the diagnostic has
  # `job_search_submit` was renamed to `job_search_typed` and demoted from
  # key_events on 2026-05-06 (see events: section).
  #
  # This block must stay equal to the set of events carrying `conversion: true`.
  # setup-ga4.mjs derives the list it syncs from `conversion:` and cross-checks
  # it against this block — two independent declarations, so a drifting one is
  # caught rather than silently followed. The four entries above `job_search_*`
  # were added on 2026-07-30 (#247): they had carried `conversion: true` for
  # some time and were already live on the property, but were never added here,
  # so every sync run printed a mismatch WARN. Add to both places or neither.

# ----------------------------------------------------------------------
# Property-side residue — exists on GA4, deliberately not in the spec above
# ----------------------------------------------------------------------
# `setup-ga4.mjs` only ever creates. It never demotes a key event or archives a
# dimension, so anything that outlived the feature needing it stays on the
# property indefinitely. `--check` reports those, and without this block it
# reported all ten on every run of a fully-synced property (#249) — which is the
# same noise-drowns-signal failure #247 was filed for, one layer up.
#
# Declaring them here does two things: `--check` collapses them to one summary
# line, and an *undeclared* property-side entry fails the check instead of
# landing in a list nobody reads. It also puts the property state in git, which
# #240 flagged as missing — before this, the only record was an issue thread.
#
# Adding an entry here is a claim that it is known and accounted for, not that
# it is fine. Include the evidence.
#
# Verified 2026-07-30 against property 298707336: zero live `gtag()` /
# user_properties call in the repo for any of these, plus the GA4 event counts
# noted per entry. NOTE: cumulative counts mislead here — `job_search_submit`
# shows 1,740 events over 365 days and 0 over 28. Window or date any recheck.
#
# Not removed because no cap is under pressure: EVENT 38/50, USER 4/25, key
# events 16/30. #240's archiving was forced by 47/50 blocking creation outright;
# there is no such pressure here, and every write to the property is a change
# that git cannot record or revert.

property_residue:
  key_events:
    - name: purchase
      reason: GA4 built-in default, present on every property. Will never be in the spec.
    - name: close_convert_lead
      reason: GA4 built-in default (lead-gen template).
    - name: qualify_lead
      reason: GA4 built-in default (lead-gen template).
    - name: job_search_submit
      reason: >
        Renamed to job_search_typed and demoted on 2026-05-06 (see the events:
        section). Last fired 2026-05-06 — the rename date exactly. 0 events in
        the 28 days to 2026-07-30.
    - name: chip_click
      reason: >
        Replaced by popular_job_click when the mobile-hero chips were reworked.
        Last fired 2026-05-02; 0 events in the 28 days to 2026-07-30.
    - name: feedback_submit
      reason: Feedback widget removed in #205. 0 events in 365 days.
    - name: email_submit_header
      reason: Newsletter signup removed in #205. 0 events in 365 days.

  user_scoped_dimensions:
    - name: is_subscribed
      reason: Newsletter signup removed in #205. Nothing in the repo sets it.
    - name: has_submitted_feedback
      reason: Feedback widget removed in #205. Nothing in the repo sets it.
    - name: subscribed_occupation_id
      reason: Newsletter signup removed in #205. Nothing in the repo sets it.

# ----------------------------------------------------------------------
# Audiences — created MANUALLY in the GA4 dashboard
# ----------------------------------------------------------------------
# Audience definitions in the Admin API are very complex JSON; for v1 of
# the OPC validation we create them by clicking through the dashboard.
# This block documents what to create and the rough filter logic.

audiences_manual:
  - name: High-intent occupations
    description: Opened a high-risk modal (proxy for high anxiety).
    filter: "occupation_modal_open where risk_tier = 'high'"
    membership_duration_days: 90

  - name: Returning visitors
    description: Came back for a second session within 28 days. (GA4 has built-in similar — optional.)
    filter: "session_start >= 2 in 28 days"
    membership_duration_days: 28
