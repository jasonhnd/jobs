name: CI

on:
  pull_request:
    branches:
      - preview
      - main
  push:
    branches:
      - preview
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce preview-to-main promotion
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && (github.head_ref != 'preview' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "Production PRs must use preview as their head branch."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Run typecheck
        run: bun run typecheck

      - name: Build production output
        run: bun run build

      # Must stay after "Build production output": these assert against
      # dist-astro/, which is gitignored, so the earlier "Run unit tests" step
      # collects them with no build present and skips every assertion (#213).
      # REQUIRE_BUILT_ARTIFACTS turns that skip into a hard failure here, so a
      # missing or reordered build step cannot silently disarm them again.
      - name: Verify rendered HTML contracts
        env:
          REQUIRE_BUILT_ARTIFACTS: '1'
        run: bun test scripts/home-css-loading.test.ts src/site/models-built.test.ts

      - name: Run repository gates
        run: bun run verify:gates

      # Every other gate reads SOURCE. These read what a browser actually
      # renders, which is the only way to see an inherited font-size or the
      # colour that reached a pixel. The suite existed since before 2026-05-28
      # but ran nowhere, and rotted: 16 of its 47 URLs had become 404s (a spec
      # that scans a missing page passes — it finds no violations because there
      # is no page), and axe's `color-contrast` rule had been switched off.
      # Both are fixed; running it here is what keeps them fixed.
      - name: Install Chromium for rendered-output checks
        run: bun x playwright install --with-deps chromium

      - name: Run rendered-output checks (a11y, §4.2 floor, layout invariants)
        run: bun x playwright test --reporter=line

      - name: Verify generated tracked files are committed
        run: git diff --exit-code
