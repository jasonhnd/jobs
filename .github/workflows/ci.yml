name: CI

on:
  pull_request:
    branches:
      - preview
      - main
  push:
    branches:
      - preview
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce preview-to-main promotion
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && (github.head_ref != 'preview' || github.event.pull_request.head.repo.full_name != github.repository)
        run: |
          echo "Production PRs must use preview as their head branch."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

      - name: Run typecheck
        run: bun run typecheck

      - name: Build production output
        run: bun run build

      # Must stay after "Build production output": these assert against
      # dist-astro/, which is gitignored, so the earlier "Run unit tests" step
      # collects them with no build present and skips every assertion (#213).
      # REQUIRE_BUILT_ARTIFACTS turns that skip into a hard failure here, so a
      # missing or reordered build step cannot silently disarm them again.
      - name: Verify rendered HTML contracts
        env:
          REQUIRE_BUILT_ARTIFACTS: '1'
        run: bun test scripts/home-css-loading.test.ts src/site/models-built.test.ts

      - name: Run repository gates
        run: bun run verify:gates

      - name: Verify generated tracked files are committed
        run: git diff --exit-code
