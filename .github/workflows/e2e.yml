name: E2E

# Playwright smoke tests against a freshly built dist-astro/. Runs on
# every PR + push to main, plus manual dispatch. Soft-fails (continue-on-
# error: false) — failures block merge, but the artifact upload step
# always runs even on test failure.
#
# Playwright + http-server are installed on-demand by scripts/run-e2e.sh
# rather than via package.json — keeps Vercel install slim (~50 MB of
# Playwright + chromium binaries don't ride along on every preview deploy).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (version pinned by .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack (activates pnpm per packageManager pin)
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies (deps only — Playwright comes via run-e2e.sh)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Bump the suffix when scripts/run-e2e.sh pins a new Playwright
          # version so the cache picks up the matching browser revision.
          key: ${{ runner.os }}-playwright-v1
          restore-keys: ${{ runner.os }}-playwright-

      - name: Build static site
        run: pnpm run build

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore
