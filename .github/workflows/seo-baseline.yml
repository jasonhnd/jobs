name: SEO Baseline

# Compares the built site against tests/baseline/ on every PR to main.
# Catches accidental drift in any of the SEO contracts:
#
#   - URL set (urls.txt)
#   - sitemap.xml + image-sitemap.xml
#   - per-URL title / description / canonical / robots / h1
#   - per-URL og:* + twitter:* tags
#   - per-URL JSON-LD payloads
#   - per-URL internal links + anchor ids
#   - public/data.* file paths
#
# When the diff is intentional (new page, retired slug, copy edit),
# the PR author runs `pnpm run capture:seo-baseline` locally and commits
# the refreshed tests/baseline/ alongside the code change, with a
# CHANGELOG note explaining what shifted and why.
#
# This is the SEO safety net for the multi-week architecture migration —
# without it, structural refactors could silently break crawl signals
# only days later in Google Search Console.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (version pinned by .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack (activates pnpm per packageManager pin)
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site (produces dist-astro/)
        run: pnpm run build

      - name: Diff current build against tests/baseline/
        run: pnpm run check:seo-baseline

      - name: Check 5-layer architecture boundaries (docs/architecture.md §6.2)
        run: pnpm run check:architecture
