name: Data validation

# Runs on every push to main and every PR. Blocks merge on failure.
#
# Source-data validation pipeline (TS-ETL replaces the legacy Python pipeline):
#   L1 schema    + L2 consistency:  bundled into `npm run build:data`
#                                   (src/data/build.ts validates before writing)
#   L3 projection sanity:           `npm run test:consistency`
#                                   (src/data/test-consistency.ts)
#   L4 end-to-end smoke:            handled by Vercel preview deploys (not in CI)
#
# Track D · PR 37 (this workflow): replaces the prior Python pipeline that ran
#   `uv sync --frozen` + `python scripts/build_data.py` + `python scripts/test_data_consistency.py`
# with the migrated TS pipeline. The "dist/ drift" guard from the old workflow
# is intentionally NOT carried over — `nowIso()` in the TS projections returns
# `new Date().toISOString()` per run, so the committed dist/ vs a fresh CI build
# always differs by ~1 line per projection. To reintroduce drift detection we
# need to make those timestamps reproducible (cache + env override). Tracked
# as a follow-up; in the meantime `test:consistency` provides semantic coverage.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: L1 + L2 — schema + consistency validation (via build)
        # build:data validates every source file under data/ before writing
        # any projection. A schema or consistency violation aborts with exit 1.
        run: npm run build:data

      - name: L3 — projection sanity
        run: npm run test:consistency
