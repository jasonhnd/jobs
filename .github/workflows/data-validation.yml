name: Data validation

# Runs on every push to main and every PR. Blocks merge on failure.
#
# Source-data validation pipeline:
#   L1 schema + L2 consistency:  bundled into `npm run build:data`
#                                (src/data/build.ts validates before writing)
#   L3 projection sanity:        `npm run test:consistency`
#                                (src/data/test-consistency.ts)
#   L4 end-to-end smoke:         handled by Vercel preview deploys (not in CI)
#
# Future: the `public/data.*` outputs are gitignored, so there's no drift guard
# in CI. If those are ever brought back under version control, set
# `BUILD_DATA_TIMESTAMP=$(git log -1 --format=%cI)` before `npm run build:data`
# so generated_at fields are deterministic, then add a `git diff --quiet -- public/data.*`
# step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: L1 + L2 — schema + consistency validation (via build)
        # build:data validates every source file under data/ before writing
        # any projection. A schema or consistency violation aborts with exit 1.
        run: npm run build:data

      - name: L3 — projection sanity
        run: npm run test:consistency
