name: CI

# Runs on every push to main and every PR. Blocks merge on failure.
#
# Validation pipeline:
#   L1 schema + L2 consistency:  bundled into `pnpm run build:data`
#                                (src/data/build.ts validates before writing)
#   L3 projection sanity:        `pnpm run test:consistency`
#                                (src/data/test-consistency.ts)
#   Type safety:                 `pnpm run typecheck` (TypeScript --noEmit)
#   Unit tests:                  `pnpm test` (node:test runner via tsx)
#   Page render:                 `pnpm run build` (Astro static SSG)
#   L4 end-to-end smoke:         handled by Vercel preview deploys
#
# Package manager: pnpm via corepack, version pinned by
# `packageManager` in package.json (currently 11.0.9). `npm` is NOT
# used — there is no package-lock.json. Node version comes from
# .nvmrc (currently 22).
#
# Future: the `public/data.*` outputs are gitignored, so there's no drift guard
# in CI. If those are ever brought back under version control, set
# `BUILD_DATA_TIMESTAMP=$(git log -1 --format=%cI)` before `pnpm run build:data`
# so generated_at fields are deterministic, then add a `git diff --quiet -- public/data.*`
# step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (version pinned by .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable corepack (activates pnpm per packageManager pin)
        run: corepack enable

      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: L1 + L2 — schema + consistency validation (via build)
        # build:data validates every source file under data/ before writing
        # any projection. A schema or consistency violation aborts with exit 1.
        run: pnpm run build:data

      - name: L3 — projection sanity
        run: pnpm run test:consistency

      - name: Astro build (catches template / route errors)
        run: pnpm exec astro build
